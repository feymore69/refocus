name: Release Refocus

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

jobs:
  publish-tauri:
    permissions:
      contents: write
      actions: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
          - platform: ubuntu-22.04
          - platform: windows-latest
    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install Linux system dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Install frontend dependencies
        run: npm ci

      - name: Build and publish release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Optional: Tauri updater signing
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # Optional: macOS signing + notarization
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        with:
          tagName: __VERSION__
          releaseName: "Refocus v__VERSION__"
          releaseBody: "Automated build for Refocus __VERSION__."
          releaseDraft: false
          prerelease: true

      - name: Collect unsigned Windows artifacts for SignPath
        if: matrix.platform == 'windows-latest' && secrets.SIGNPATH_API_TOKEN != ''
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path signpath-input | Out-Null
          $bundleRoot = "src-tauri/target/release/bundle"
          Get-ChildItem "$bundleRoot/msi" -Recurse -File -ErrorAction SilentlyContinue | Copy-Item -Destination signpath-input -Force
          Get-ChildItem "$bundleRoot/nsis" -Recurse -File -ErrorAction SilentlyContinue | Copy-Item -Destination signpath-input -Force
          $count = (Get-ChildItem signpath-input -File -ErrorAction SilentlyContinue | Measure-Object).Count
          if ($count -eq 0) { throw "No Windows artifacts found for signing." }

      - name: Upload unsigned artifacts to GitHub
        id: upload-unsigned-artifact
        if: matrix.platform == 'windows-latest' && secrets.SIGNPATH_API_TOKEN != ''
        uses: actions/upload-artifact@v4
        with:
          name: unsigned-windows-bundle
          path: signpath-input/*

      - name: Sign Windows artifacts via SignPath
        id: signpath
        if: matrix.platform == 'windows-latest' && secrets.SIGNPATH_API_TOKEN != ''
        uses: signpath/github-action-submit-signing-request@v2
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ secrets.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ secrets.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ secrets.SIGNPATH_SIGNING_POLICY_SLUG }}
          github-artifact-id: ${{ steps.upload-unsigned-artifact.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: signpath-signed

      - name: Upload signed Windows artifacts to GitHub Release
        if: matrix.platform == 'windows-latest' && secrets.SIGNPATH_API_TOKEN != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: |
            signpath-signed/**/*
