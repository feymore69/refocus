<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Refocus Guard</title>
    <style>
      :root {
        color-scheme: dark;
      }

      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
        box-sizing: border-box;
      }

      *,
      *::before,
      *::after {
        box-sizing: inherit;
      }

      body {
        font-family: Inter, "Segoe UI", -apple-system, BlinkMacSystemFont, sans-serif;
        background:
          radial-gradient(1050px 680px at 18% 24%, rgba(84, 156, 255, 0.26), transparent 60%),
          radial-gradient(980px 720px at 84% 30%, rgba(76, 226, 202, 0.2), transparent 62%),
          linear-gradient(160deg, rgba(9, 21, 46, 0.985), rgba(4, 11, 26, 0.99));
        color: rgba(239, 245, 255, 0.98);
        display: flex;
        align-items: center;
        justify-content: center;
        user-select: none;
        cursor: not-allowed;
        padding: 32px;
      }

      .guard-root {
        width: min(560px, calc(100vw - 64px));
        border-radius: 28px;
        border: 1px solid rgba(176, 209, 255, 0.22);
        background:
          linear-gradient(180deg, rgba(255, 255, 255, 0.03), rgba(255, 255, 255, 0)),
          linear-gradient(160deg, rgba(15, 30, 58, 0.8), rgba(9, 18, 37, 0.84));
        box-shadow:
          0 28px 72px rgba(2, 8, 20, 0.5),
          inset 0 1px 0 rgba(255, 255, 255, 0.12);
        backdrop-filter: blur(18px);
        padding: 32px 34px;
        text-align: center;
      }

      .guard-logo {
        display: flex;
        justify-content: center;
        margin-bottom: 14px;
      }

      .guard-logo svg {
        width: 60px;
        height: 60px;
        filter: drop-shadow(0 0 18px rgba(76, 194, 255, 0.32));
      }

      .guard-badge {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        padding: 6px 12px;
        border-radius: 999px;
        border: 1px solid rgba(137, 190, 255, 0.2);
        background: rgba(11, 22, 43, 0.45);
        color: rgba(203, 225, 255, 0.9);
        font-size: 12px;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }

      h1 {
        margin: 20px 0 0;
        font-size: 28px;
        font-weight: 640;
        letter-spacing: 0.01em;
      }

      .guard-copy {
        margin: 12px auto 0;
        max-width: 38ch;
        font-size: 15px;
        line-height: 1.65;
        color: rgba(221, 234, 255, 0.88);
      }

      .guard-footnote {
        margin: 20px auto 0;
        max-width: 44ch;
        font-size: 12px;
        line-height: 1.6;
        color: rgba(180, 202, 232, 0.68);
      }
    </style>
  </head>
  <body>
    <main class="guard-root" role="status" aria-live="assertive" aria-label="Break in progress">
      <div class="guard-logo" aria-hidden="true">
        <svg viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
          <defs>
            <linearGradient id="refocus-eye-gradient" x1="8" y1="32" x2="56" y2="32" gradientUnits="userSpaceOnUse">
              <stop stop-color="#2D73FF" />
              <stop offset="0.48" stop-color="#2ED5FF" />
              <stop offset="1" stop-color="#63F2C8" />
            </linearGradient>
          </defs>
          <path
            d="M8 32C14.8 23.7 22.9 19.6 32 19.6C41.1 19.6 49.2 23.7 56 32C49.2 40.3 41.1 44.4 32 44.4C22.9 44.4 14.8 40.3 8 32Z"
            fill="rgba(8, 19, 41, 0.78)"
            stroke="url(#refocus-eye-gradient)"
            stroke-width="2.4"
          />
          <circle cx="32" cy="32" r="10.6" stroke="url(#refocus-eye-gradient)" stroke-width="2.2" />
          <circle cx="32" cy="32" r="3.6" fill="url(#refocus-eye-gradient)" />
          <path d="M32 18.2V23.2M32 40.8V45.8M18.2 32H23.2M40.8 32H45.8" stroke="#EAF4FF" stroke-linecap="round" stroke-width="2.2" />
        </svg>
      </div>
      <div class="guard-badge">Refocus lock</div>
      <h1>Break in progress</h1>
      <p class="guard-copy">Refocus is active on your main display. Return there to continue your break.</p>
      <p class="guard-footnote">
        This screen stays here until the active break is completed, snoozed, or skipped on your main monitor.
      </p>
    </main>
  </body>
</html>
